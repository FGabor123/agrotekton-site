name: Localize website images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current site assets into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/Untitled-design-11-3QtiE.jpg' -o images/what-we-do.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/export-marketing-outline-svgrepo-com-6lbfv.svg' -o images/origin.svg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/sales-up-graph-svgrepo-com-JnDUT.svg' -o images/readiness.svg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/event-store-svgrepo-com-wYo5_.svg' -o images/execution.svg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-enginakyurt-10899607-t1WAK.jpg' -o images/process-1.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-virgo-oktaviano-239174809-356605121-gye5b.jpg' -o images/process-2.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-gu-ko-2150570603-32596369-MYAHw.jpg' -o images/process-banner.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-polya-loginova-1959356-16488840-mR0rN.jpg' -o images/chillies.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-paco-alamo-7288774-qTjGf.jpg' -o images/french-beans.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-l-lum-2158594693-36940965-w8lBU.jpg' -o images/sugar-snaps.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-yuri-flores-3229414-35150696-Togbn.jpg' -o images/avocado.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-diego-concepcion-3131144-5182348-6WnaX.jpg' -o images/passion-fruit.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/8b90e80154600398a636d9af124eddb4-h1OG3.jpg' -o images/baby-corn.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/photo_2026-04-20_17-35-51-CD2ZK.jpg' -o images/gabor.jpg
          curl -fL 'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pet-Pkvk4.jpg' -o images/peter.jpg
      - name: Replace external image URLs with local files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps={
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/Removebackgroundproject-pvZM8.png':'images/logo.webp',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/Untitled-design-11-3QtiE.jpg':'images/what-we-do.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/export-marketing-outline-svgrepo-com-6lbfv.svg':'images/origin.svg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/sales-up-graph-svgrepo-com-JnDUT.svg':'images/readiness.svg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/event-store-svgrepo-com-wYo5_.svg':'images/execution.svg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-enginakyurt-10899607-t1WAK.jpg':'images/process-1.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-virgo-oktaviano-239174809-356605121-gye5b.jpg':'images/process-2.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-gu-ko-2150570603-32596369-MYAHw.jpg':'images/process-banner.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-polya-loginova-1959356-16488840-mR0rN.jpg':'images/chillies.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-paco-alamo-7288774-qTjGf.jpg':'images/french-beans.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-l-lum-2158594693-36940965-w8lBU.jpg':'images/sugar-snaps.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-yuri-flores-3229414-35150696-Togbn.jpg':'images/avocado.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-diego-concepcion-3131144-5182348-6WnaX.jpg':'images/passion-fruit.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/8b90e80154600398a636d9af124eddb4-h1OG3.jpg':'images/baby-corn.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/photo_2026-04-20_17-35-51-CD2ZK.jpg':'images/gabor.jpg',
          'https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pet-Pkvk4.jpg':'images/peter.jpg',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s)
          p=Path('styles.css'); s=p.read_text()
          s=s.replace("https://cdn.cmsfly.com/69c56b624e7bcc009994d91a/images/pexels-shanu-azhikode-531962-32564142-sKQm3.jpg","images/hero.jpg")
          p.write_text(s)
          PY
      - name: Commit localized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'Move website images into repository'
          git push
